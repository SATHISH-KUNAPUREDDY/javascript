<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --primary-color: #3b82f6; 
            --primary-color-light: #60a5fa;
            --background-start: #111827;
            --background-end: #1f2937;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--background-start), var(--background-end));
            transition: background 0.5s ease;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
            opacity: 0.7;
            transition: opacity .2s;
        }

        input[type="range"]:hover {
            opacity: 1;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary-color);
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--primary-color);
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        .fade-in {
            animation: fadeIn 0.7s ease-out forwards;
        }

        .fade-out {
            animation: fadeOut 0.5s ease-in forwards;
        }

        #bmiGauge {
            transition: transform 0.5s ease-in-out;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
        
.tracker-section {
  margin-top: 1.5rem;
  padding: 1.5rem;
  border-radius: 1rem;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  transition: all 0.3s ease;
}

.tracker-section:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 16px rgba(0,0,0,0.2);
}

.tracker-section h3 {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.75rem;
  color: var(--primary-color-light);
}

.tracker-section input,
.tracker-section select {
  width: 100%;
  padding: 0.6rem 0.75rem;
  border-radius: 0.5rem;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.08);
  color: white;
  margin-bottom: 0.75rem;
  transition: border 0.2s, background 0.2s;
}

.tracker-section input:focus,
.tracker-section select:focus {
  outline: none;
  border-color: var(--primary-color);
  background: rgba(255, 255, 255, 0.15);
}

.tracker-section button {
  background: var(--primary-color);
  color: white;
  font-weight: 600;
  padding: 0.6rem 1rem;
  border-radius: 0.5rem;
  transition: background 0.3s, transform 0.2s;
}

.tracker-section button:hover {
  background: var(--primary-color-light);
  transform: scale(1.05);
}


.progress-container {
  background: rgba(255, 255, 255, 0.15);
  width: 100%;
  height: 25px;
  border-radius: 12px;
  overflow: hidden;
  margin-top: 0.5rem;
}

.progress-bar {
  height: 100%;
  text-align: center;
  font-size: 0.9rem;
  font-weight: 600;
  line-height: 25px;
  color: white;
  border-radius: 12px;
  transition: width 0.5s ease;
}

#stepsProgress {
  background: #2ecc71; 
}

#waterProgress {
  background: #3498db; 
}

#moodHistory {
  margin-top: 0.75rem;
  list-style: none;
  padding: 0;
  max-height: 120px;
  overflow-y: auto;
}

#moodHistory li {
  padding: 0.4rem 0.6rem;
  margin-bottom: 0.4rem;
  border-radius: 0.4rem;
  background: rgba(255, 255, 255, 0.08);
  font-size: 0.9rem;
}


    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

   
    <div id="welcomeScreen" class="w-full max-w-md text-center fade-in">
        <div class="glass-card p-8 rounded-2xl shadow-lg">
            <h1 class="text-4xl font-bold mb-2">Welcome!</h1>
            <p class="text-gray-300 mb-6">What should we call you?</p>
            <form id="welcomeForm">
                <input type="text" id="nameInput" placeholder="Enter your name..." class="w-full bg-gray-700/50 border border-gray-600 rounded-lg py-3 px-4 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] transition duration-300">
                <button type="submit" class="w-full mt-4 bg-[var(--primary-color)] text-white font-bold py-3 px-4 rounded-lg hover:bg-[var(--primary-color-light)] transition duration-300 transform hover:scale-105">
                    Continue
                </button>
            </form>
        </div>
    </div>

    <main id="dashboard" class="w-full max-w-5xl hidden">
        <h1 id="greeting" class="text-4xl font-bold mb-8 text-center"></h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="glass-card p-6 rounded-2xl shadow-lg col-span-1 md:col-span-2 lg:col-span-1">
                <h2 class="text-2xl font-semibold mb-4">Your Time on Earth</h2>
                <input type="date" id="birthDate" class="w-full bg-gray-700/50 border border-gray-600 rounded-lg p-2.5 mb-4 text-white">
                <div class="text-center space-y-2 mt-4">
                    <div>
                        <span id="years" class="text-5xl font-bold text-[var(--primary-color)]">0</span>
                        <span class="text-gray-300">years</span>
                    </div>
                    <div>
                        <span id="months" class="text-3xl font-semibold text-gray-200">0</span>
                        <span class="text-gray-400">months</span>
                    </div>
                    <div>
                        <span id="days" class="text-3xl font-semibold text-gray-200">0</span>
                        <span class="text-gray-400">days</span>
                    </div>
                </div>
            </div>

            <div class="glass-card p-6 rounded-2xl shadow-lg col-span-1 md:col-span-2">
                <h2 class="text-2xl font-semibold mb-4">Body Mass Index (BMI)</h2>
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex-1 space-y-4">
                        <div>
                            <label for="height" class="flex justify-between font-medium mb-1">Height: <span id="heightValue">170 cm</span></label>
                            <input type="range" id="height" min="120" max="220" value="170" class="w-full">
                        </div>
                        <div>
                            <label for="weight" class="flex justify-between font-medium mb-1">Weight: <span id="weightValue">65 kg</span></label>
                            <input type="range" id="weight" min="30" max="150" value="65" class="w-full">
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col items-center justify-center">
                        <div class="relative w-48 h-24 overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-full border-4 border-gray-600 rounded-t-full border-b-0"></div>
                            <div id="bmiGauge" class="absolute top-0 left-0 w-full h-full border-4 border-[var(--primary-color)] rounded-t-full border-b-0 origin-bottom" style="transform: rotate(-90deg);"></div>
                        </div>
                        <div class="text-center -mt-4">
                            <span id="bmiValue" class="text-5xl font-bold">22.5</span>
                            <div id="bmiCategory" class="font-semibold text-lg mt-1 text-green-400">Normal</div>
                        </div>
                    </div>
                </div>
          
<section class="tracker-section">
  <h3>Mood Tracker</h3>
  <select id="moodSelect">
    <option value="">Select Mood</option>
    <option value="😊 Happy">😊 Happy</option>
    <option value="😐 Neutral">😐 Neutral</option>
    <option value="😢 Sad">😢 Sad</option>
    <option value="😡 Angry">😡 Angry</option>
  </select>
  <button id="saveMood">Save Mood</button>
  <ul id="moodHistory"></ul>
</section>

<!-- Steps Counter -->
<section class="tracker-section">
  <h3>Steps Counter</h3>
  <input type="number" id="stepsInput" placeholder="Enter steps">
  <button id="saveSteps">Save Steps</button>
  <div class="progress-container">
    <div id="stepsProgress" class="progress-bar"></div>
  </div>
</section>

<!-- Water Intake Tracker -->
<section class="tracker-section">
  <h3>Water Intake Tracker</h3>
  <input type="number" id="waterInput" placeholder="Glasses (250ml each)">
  <button id="saveWater">Save Water</button>
  <div class="progress-container">
    <div id="waterProgress" class="progress-bar"></div>
  </div>
</section>


            </div>

    </main>

    <script src="./script.js"> </script>
</body>
</html>
