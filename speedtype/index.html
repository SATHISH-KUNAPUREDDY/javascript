<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Document</title>
<style>
  :root{
    --bg:#0b1220; --card:#0f1724; --accent:#06b6d4; --muted:#98a3b3;
    --glass: rgba(255,255,255,0.03); --success: #10b981; --danger:#ef4444;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:Inter,system-ui,Segoe UI,Roboto,-apple-system; background:linear-gradient(180deg,var(--bg),#071028); color:#e6eef6;
    padding:28px;
  }
  .card{
    width:100%; max-width:900px; background:linear-gradient(180deg,#07102266,var(--card)); border-radius:var(--radius);
    padding:20px; box-shadow: 0 10px 30px rgba(2,6,23,0.6);
  }
  h1{margin:0 0 10px 0; color:var(--accent); font-size:20px}
  .controls{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
  select, button{padding:8px 10px; border-radius:8px; border:none; background:var(--glass); color:inherit}
  button.primary{background:var(--accent); color:#042027}
  .meta{display:flex; gap:16px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
  .stat{background:rgba(255,255,255,0.02); padding:8px 12px; border-radius:8px; font-size:14px; color:var(--muted)}
  .passage{
    background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
    padding:14px; border-radius:10px; min-height:120px; line-height:1.6; font-size:18px; color:#e6eef6;
    user-select:none; white-space:pre-wrap;
  }
  .char{padding:1px 2px; border-radius:4px}
  .char.current{outline:2px solid rgba(6,182,212,0.12)}
  .char.correct{color:var(--success)}
  .char.incorrect{color:var(--danger); text-decoration:underline wavy rgba(239,68,68,0.25)}
  .actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .results{margin-top:14px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  .small{font-size:13px; color:var(--muted)}
  .best{font-size:13px; color:#93c5fd}
  footer{margin-top:6px; color:var(--muted); font-size:13px}
  @media (max-width:640px){
    .passage{font-size:16px}
  }
</style>
</head>
<body>
  <div class="card" role="main">
    <h1>Typing Speed Tester</h1>

    <div class="controls">
      <label>
        Duration:
        <select id="duration">
          <option value="15">15s</option>
          <option value="30" selected>30s</option>
          <option value="60">60s</option>
          <option value="120">120s</option>
        </select>
      </label>

      <button id="newPass">New Passage</button>
      <button id="restart" class="primary">Restart</button>
      <div class="small">Start typing to begin. Use Backspace to correct.</div>
    </div>

    <div class="meta">
      <div class="stat">Time <strong id="time">00:00</strong></div>
      <div class="stat">WPM <strong id="wpm">0</strong></div>
      <div class="stat">CPM <strong id="cpm">0</strong></div>
      <div class="stat">Accuracy <strong id="acc">100%</strong></div>
      <div class="stat">Mistakes <strong id="mistakes">0</strong></div>
      <div class="stat">Progress <strong id="progress">0%</strong></div>
    </div>

    <div id="passage" class="passage" aria-live="polite"></div>

    <div class="actions">
      <button id="copyResult">Copy Result</button>
      <div class="best" id="bestRecord">Best: —</div>
    </div>

    <div class="results" id="finalArea" aria-hidden="true"></div>

    <footer>Tip: The test starts on your first typed character. Results are saved per duration.</footer>
  </div>

<script src="./script.js"></script>
</body>
</html>
