<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FakeStore API Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .card p {
      font-size: 16px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>FakeStore Products</h1>

  <div class="container" id="dataContainer"></div>

  <script>
    const container = document.getElementById("dataContainer");

    fetch("https://fakestoreapi.com/products")
      .then(res => res.json())
      .then(data => {
        data.forEach(product => {
          const card = document.createElement("div");
          card.classList.add("card");
          card.innerHTML = `
            <h3>${product.title}</h3>
            <p>💰 Price: $${product.price}</p>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        container.innerHTML = "<p>Error fetching FakeStore data.</p>";
        console.error(err);
      });
  </script>
</body>
</html>
