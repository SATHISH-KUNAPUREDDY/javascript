<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #1db954;
    }
    input {
      padding: 10px;
      width: 300px;
      border-radius: 20px;
      border: none;
      outline: none;
    }
    button {
      padding: 10px 20px;
      border: none;
      background: #1db954;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      margin-left: 10px;
    }
    button:hover{
        background-color:#55dd85;
    }
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    img {
      width: 100%;
      border-radius: 12px;
    }
    audio {
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Music Search App</h1>
  <input type="text" id="searchInput" placeholder="Search for a song or artist...">
  <button onclick="searchMusic()">Search</button>

  <div class="results" id="results"></div>

  <script src="./script.js"></script>
</body>
</html>
