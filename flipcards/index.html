<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Document</title>
  <style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #eb991e;
  --accent2: #ef4444;
  --glass: rgba(255, 255, 255, 0.04);
  --card-size: 120px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, Segoe UI, Roboto;
  background-color: aliceblue;
  color: #e6eef6;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center; 
}

.game-wrap {
  width: 100%;
  max-width: 980px;
  display: flex;
  flex-direction: column;  
  align-items: center;
  justify-content: center;
  color: #042027;
}

header {
  display: flex;
  flex-direction: column;  
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

header h1 {
  font-size: 28px;
  margin: 0;
  color: var(--accent);
}

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap; 
}

select,
input[type=range] {
  background: var(--glass);
  color: inherit;
  border: 1px solid rgba(255, 255, 255, 0.05);
  padding: 6px 8px;
  border-radius: 8px;
}

button {
  background: var(--accent);
  border: none;
  color: #042027;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}

.status {
  display: flex;
  justify-content: center; 
  gap: 14px;
  align-items: center;
  background: rgba(255, 255, 255, 0.03);
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 16px;
}

.status div {
  font-size: 14px;
}

.grid {
  display: grid;
  gap: 12px;
  justify-content: center; 
  align-items: center;
  margin: 16px auto;
}

.card {
  width: var(--card-size);
  height: var(--card-size);
  perspective: 1000px;
}

.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  backface-visibility: hidden;
  box-shadow: 0 6px 18px rgba(2, 6, 23, 0.6);
}

.face.front {
  background: linear-gradient(180deg, var(--card), #0b1626);
}

.face.back {
  background: linear-gradient(180deg, #fff, #fff);
  transform: rotateY(180deg);
  color: #051025;
}

.emoji {
  font-size: 40px;
}

.matched .card-inner {
  box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.12);
  transform: scale(1.02);
}

.footer {
  margin-top: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;  
  gap: 8px;
}

.best {
  font-size: 13px;
  color: rgb(8, 14, 19);
}

.grid.size-4 {
  grid-template-columns: repeat(4, var(--card-size));
}

.grid.size-6 {
  grid-template-columns: repeat(6, var(--card-size));
  --card-size: 96px;
}

.grid.size-8 {
  grid-template-columns: repeat(8, var(--card-size));
  --card-size: 72px;
}

@media (max-width: 640px) {
  :root {
    --card-size: 80px;
  }
  .grid.size-4 {
    grid-template-columns: repeat(3, var(--card-size));
  }
}

  </style>
</head>
<body>
  <div class="game-wrap">
    <header>
      <h1>Memory Match</h1>
      <div class="controls">
        <label for="difficulty" style="color: #0f1724;">Grid:</label>
        <select id="difficulty" title="Change grid size">
          <option value="4" style="color: #0f1724;">4x4 (Easy)</option>
          <option value="6" style="color: #0f1724;">6x6 (Medium)</option>
          <option value="8" style="color: #0f1724;">8x8 (Hard)</option>
        </select>
        <button id="restart">Restart</button>
      </div>
    </header>

    <div class="status">
      <div>Moves: <strong id="moves">0</strong></div>
      <div>Time: <strong id="timer">00:00</strong></div>
      <div>Matches: <strong id="matches">0</strong></div>
    </div>

    <main>
      <div id="grid" class="grid size-4" aria-live="polite"></div>
    </main>

    <div class="footer">
      <div class="best">Best: <span id="bestScore">—</span></div>
      <div style="font-size:13px; color:rgb(1, 16, 6)">Tip: Click two cards to flip. Try to memorize positions!</div>
    </div>
  </div>

  <script src="./script.js">  
  </script>
</body>
</html>
