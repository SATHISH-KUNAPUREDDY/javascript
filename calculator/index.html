<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background-color: #111;
      background-size: 600% 600%;
      animation: gradientBG 15s ease infinite;
    }
    .calculator {
      background: rgba(0, 0, 0, 0.85);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .display {
      background: #111;
      color: #0f0;
      font-size: 2rem;
      padding: 15px;
      border-radius: 10px;
      text-align: right;
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 70px);
      gap: 15px;
    }
    button {
      padding: 20px;
      font-size: 1.2rem;
      border: none;
      border-radius: 15px;
      background: #111;
      color: #0ff;
     cursor: pointer;
     transition: transform 0.2s, box-shadow 0.2s, color 0.2s;
     text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
     box-shadow: 0 0 10px #0ff, 0 0 20px #0ff inset;
  }
  button:hover {
    transform: scale(1.05);
    color: #fff;
    background: #0ff;
    box-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0ff;
  }
  .equal {
    grid-column: span 2;
    background: #111;
    color: #0f0;
    text-shadow: 0 0 5px #0f0, 0 0 10px #0f0;
    box-shadow: 0 0 10px #0f0, 0 0 20px #0f0 inset;
  }
  .equal:hover {
    background: #0f0;
    color: #000;
    box-shadow: 0 0 20px #0f0, 0 0 40px #0f0, 0 0 60px #0f0;
  }
  .clear {
    background: #111;
    color: #f00;
    text-shadow: 0 0 5px #f00, 0 0 10px #f00;
    box-shadow: 0 0 10px #f00, 0 0 20px #f00 inset;
  }
  .clear:hover {
    background: #f00;
    color: #000;
    box-shadow: 0 0 20px #f00, 0 0 40px #f00, 0 0 60px #f00;
  }
  button.operator {
  background: #111;
  color: #ffa500; 
  text-shadow: 0 0 5px #ffa500, 0 0 10px #ffa500;
  box-shadow: 0 0 10px #ffa500, 0 0 20px #ffa500 inset;
}
button.operator:hover {
   background: #ffa500;
  color: #000;
  box-shadow: 0 0 20px #ffa500, 0 0 40px #ffa500, 0 0 60px #ffa500;
}
button.delete {
  background: #111;
  color: #ff00ff;
  text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff;
  box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff inset;
}
button.delete:hover {
  background: #ff00ff;
  color: #000;
  box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #ff00ff;
}
button.dot {
  background: #111;
  color: #f1f1f1;
  text-shadow: 0 0 5px #f1f1f1, 0 0 10px #f1f1f1;
  box-shadow: 0 0 10px #f1f1f1, 0 0 20px #f1f1f1 inset;
}
button.dot:hover {
  background: #f1f1f1;
  color: #000;
  box-shadow: 0 0 10px #f1f1f1, 0 0 20px #f1f1f1, 0 0 30px #f1f1f1;
}





</style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
<button class="delete" onclick="deleteChar()">DEL</button>
<button class="operator" onclick="appendChar('%')">%</button>
<button class="operator" onclick="appendChar('/')">÷</button>

<button onclick="appendChar('7')">7</button>
<button onclick="appendChar('8')">8</button>
<button onclick="appendChar('9')">9</button>
<button class="operator" onclick="appendChar('*')">×</button>

<button onclick="appendChar('4')">4</button>
<button onclick="appendChar('5')">5</button>
<button onclick="appendChar('6')">6</button>
<button class="operator" onclick="appendChar('-')">−</button>

<button onclick="appendChar('1')">1</button>
<button onclick="appendChar('2')">2</button>
<button onclick="appendChar('3')">3</button>
<button class="operator" onclick="appendChar('+')">+</button>

<button onclick="appendChar('0')">0</button>
<button class="dot" onclick="appendChar('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
