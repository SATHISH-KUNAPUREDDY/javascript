<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #98d7ea;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    #loading {
      text-align: center;
      font-size: 18px;
      color: #555;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      max-width: 120px;
      max-height: 120px;
      margin-bottom: 15px;
    }
    .card h3 {
      font-size: 16px;
      margin-bottom: 10px;
      text-align: center;
    }
    .card p {
      font-size: 15px;
      color: #444;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1 >FakeStore Products</h1>
  <div id="loading">Loading products, please wait...</div>
  <div class="container" id="dataContainer"></div>

  <script src="./script.js"> </script>
</body>
</html>
